<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ronnie's Experiments & Visualizations</title>
  <meta name="description" content="Interactive prototypes, algorithmic visualizers, physics simulations, and learning sandboxes by Ronnie Ghose.">
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --card-border: #30363d;
      --card-hover: #1f242c;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-glow: rgba(88, 166, 255, 0.15);
      --tag-bg: #21262d;
      --tag-text: #7ee787;
      --border: #30363d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.5;
      padding: 2.5rem 1.5rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
    }

    header {
      margin-bottom: 2.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 2rem;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      flex-wrap: wrap;
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #fff;
    }

    .tagline {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
      max-width: 650px;
    }

    .nav-links {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.85rem;
      border-radius: 6px;
      font-size: 0.875rem;
      color: var(--text-main);
      background-color: var(--tag-bg);
      border: 1px solid var(--border);
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .nav-link:hover {
      background-color: var(--card-border);
      color: var(--accent);
      border-color: var(--accent);
    }

    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    @media (min-width: 640px) {
      .toolbar {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
    }

    .search-input {
      padding: 0.6rem 1rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.95rem;
      width: 100%;
      max-width: 340px;
      outline: none;
      transition: border-color 0.15s;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .categories {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .cat-btn {
      padding: 0.4rem 0.8rem;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 20px;
      font-size: 0.825rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .cat-btn:hover {
      color: var(--text-main);
      border-color: var(--text-muted);
    }

    .cat-btn.active {
      background: var(--accent);
      color: #0d1117;
      border-color: var(--accent);
      font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      text-decoration: none;
      color: inherit;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      background: var(--card-hover);
    }

    .card-category {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 0.6rem;
    }

    .card-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
      flex: 1;
    }

    .card-tags {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }

    .tag {
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      background: var(--tag-bg);
      color: var(--tag-text);
      border-radius: 4px;
      border: 1px solid rgba(126, 231, 135, 0.2);
    }

    .card-action {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--accent);
    }

    .card-action svg {
      transition: transform 0.15s ease;
    }

    .card:hover .card-action svg {
      transform: translateX(4px);
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-muted);
    }

    footer {
      margin-top: 4rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-top">
        <div>
          <h1>Ronnie's Experiments</h1>
          <p class="tagline">Interactive prototypes, physics simulations, algorithmic visualizations, and learning sandboxes.</p>
        </div>
        <nav class="nav-links">
          <a class="nav-link" href="https://sghose.me" rel="noopener">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
            sghose.me
          </a>
        </nav>
      </div>
    </header>

    <div class="toolbar">
      <input type="text" id="searchInput" class="search-input" placeholder="Search experiments or tags..." aria-label="Search experiments">
      <div class="categories" id="categories">
        <button class="cat-btn active" data-cat="All">All</button>
        <button class="cat-btn" data-cat="Visualizations">Visualizations</button>
        <button class="cat-btn" data-cat="Algorithms">Algorithms</button>
        <button class="cat-btn" data-cat="Simulations">Simulations</button>
      </div>
    </div>

    <main class="grid" id="experimentGrid">
      <!-- Injected via JavaScript -->
    </main>

    <footer>
      Ronnie Ghose &bull; Experiments &amp; Visualizations
    </footer>
  </div>

  <script>
    const fallbackExperiments = [
      {
        id: "tabby-slink",
        title: "Tabby Slink",
        description: "A brown mackerel tabby on a low nocturnal stalk: planted paws, a hovering step, tail-tip freezes, and a coat of broken stripes in moonlight.",
        path: "experiments/tabby-slink/",
        category: "Visualizations",
        tags: ["WebGL", "Three.js", "Animation", "Cat", "Interactive"],
        date: "2026-10-07"
      },
      {
        id: "particle-field",
        title: "Interactive Particle Vector Field",
        description: "Real-time canvas flow field with velocity vectors, cursor gravitational attraction, and customizable palettes.",
        path: "experiments/particle-field/",
        category: "Visualizations",
        tags: ["Canvas", "Physics", "Generative", "Interactive"],
        date: "2026-10-02"
      },
      {
        id: "sorting-visualizer",
        title: "Sorting Algorithm Visualizer",
        description: "Step-by-step visualizer comparing Quicksort, Mergesort, Heapsort, and Bubble sort with real-time comparison counts, array metrics, and speed controls.",
        path: "experiments/sorting-visualizer/",
        category: "Algorithms",
        tags: ["Algorithms", "Data Structures", "Benchmarking", "Education"],
        date: "2026-10-02"
      },
      {
        id: "cellular-automata",
        title: "Cellular Automata Lab",
        description: "Conway's Game of Life, Brian's Brain, and HighLife simulators with interactive brush drawing, preset oscillators, and spaceship launchers.",
        path: "experiments/cellular-automata/",
        category: "Simulations",
        tags: ["Simulation", "Math", "Emergence", "Grid"],
        date: "2026-10-02"
      },
      {
        id: "lower-leg-circulation",
        title: "Lower Leg Circulation & DVT Visualizer",
        description: "Explore how heel raises, ankle motion, walking, and rest drive the calf-muscle pump and its one-way vein valves, with an educational DVT concept view.",
        path: "experiments/lower-leg-circulation/",
        category: "Simulations",
        tags: ["Anatomy", "Circulation", "Health Education", "Interactive"],
        date: "2026-10-05"
      }
    ];

    let experiments = fallbackExperiments;
    let activeCategory = "All";
    let searchQuery = "";

    async function loadExperiments() {
      try {
        const res = await fetch("experiments.json");
        if (res.ok) {
          experiments = await res.json();
        }
      } catch (err) {
        console.warn("Using embedded manifest fallback:", err);
      }
      render();
    }

    function render() {
      const grid = document.getElementById("experimentGrid");
      const filtered = experiments.filter(item => {
        const matchesCategory = activeCategory === "All" || item.category === activeCategory;
        const q = searchQuery.toLowerCase().trim();
        const matchesSearch = !q ||
          item.title.toLowerCase().includes(q) ||
          item.description.toLowerCase().includes(q) ||
          item.tags.some(t => t.toLowerCase().includes(q));
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty-state">No experiments found matching your filter.</div>';
        return;
      }

      grid.innerHTML = filtered.map(item => `
        <a class="card" href="${item.path}">
          <div>
            <div class="card-category">${item.category}</div>
            <h2 class="card-title">${item.title}</h2>
            <p class="card-desc">${item.description}</p>
          </div>
          <div>
            <div class="card-tags">
              ${item.tags.map(t => `<span class="tag">${t}</span>`).join("")}
            </div>
            <div class="card-action">
              Launch Experiment
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </div>
          </div>
        </a>
      `).join("");
    }

    document.getElementById("searchInput").addEventListener("input", e => {
      searchQuery = e.target.value;
      render();
    });

    document.getElementById("categories").addEventListener("click", e => {
      if (e.target.classList.contains("cat-btn")) {
        document.querySelectorAll(".cat-btn").forEach(btn => btn.classList.remove("active"));
        e.target.classList.add("active");
        activeCategory = e.target.dataset.cat;
        render();
      }
    });

    loadExperiments();
  </script>
</body>
</html>
