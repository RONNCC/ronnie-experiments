  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --card-border: #30363d;
      --card-hover: #1f242c;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-glow: rgba(88, 166, 255, 0.15);
      --tag-bg: #21262d;
      --tag-text: #7ee787;
      --border: #30363d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.5;
      padding: 2.5rem 1.5rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
    }

    header {
      margin-bottom: 2.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 2rem;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      flex-wrap: wrap;
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #fff;
    }

    .tagline {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
      max-width: 650px;
    }

    .nav-links {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.85rem;
      border-radius: 6px;
      font-size: 0.875rem;
      color: var(--text-main);
      background-color: var(--tag-bg);
      border: 1px solid var(--border);
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .nav-link:hover {
      background-color: var(--card-border);
      color: var(--accent);
      border-color: var(--accent);
    }

    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    @media (min-width: 760px) {
      .toolbar {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
    }

    .search-box {
      position: relative;
      width: 100%;
      max-width: 360px;
    }

    .search-icon {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      display: flex;
      align-items: center;
    }

    .search-input {
      padding: 0.6rem 2.2rem 0.6rem 2.35rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.95rem;
      width: 100%;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .search-clear {
      position: absolute;
      right: 0.5rem;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.25rem;
      border-radius: 4px;
      display: none;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .search-clear:hover {
      color: var(--text-main);
      background: var(--tag-bg);
    }

    .search-clear.visible {
      display: inline-flex;
    }

    .categories {
      display: flex;
      gap: 0.45rem;
      flex-wrap: wrap;
    }

    .cat-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.38rem;
      padding: 0.38rem 0.78rem;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 20px;
      font-size: 0.82rem;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .cat-btn:hover {
      color: var(--text-main);
      border-color: var(--text-muted);
    }

    .cat-btn.zero {
      opacity: 0.48;
    }

    .cat-btn.active {
      background: var(--accent);
      color: #0d1117;
      border-color: var(--accent);
      font-weight: 600;
      opacity: 1;
    }

    .cat-count {
      font-size: 0.72rem;
      padding: 0.05rem 0.4rem;
      border-radius: 10px;
      background: rgba(240, 246, 252, 0.08);
      color: inherit;
      font-variant-numeric: tabular-nums;
    }

    .cat-btn.active .cat-count {
      background: rgba(13, 17, 23, 0.2);
    }

    .filter-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
      padding: 0.55rem 0.85rem;
      background: rgba(22, 27, 34, 0.7);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.83rem;
      color: var(--text-muted);
    }

    .filter-status[hidden] {
      display: none;
    }

    .filter-status-left {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .filter-status strong {
      color: var(--text-main);
    }

    .active-tag-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.18rem 0.55rem;
      border-radius: 4px;
      font-size: 0.76rem;
      font-family: inherit;
      font-weight: 600;
      background: rgba(126, 231, 135, 0.15);
      color: var(--tag-text);
      border: 1px solid rgba(126, 231, 135, 0.45);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .active-tag-chip:hover {
      background: rgba(126, 231, 135, 0.25);
    }

    .clear-all-btn {
      background: transparent;
      border: none;
      color: var(--accent);
      font-size: 0.82rem;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      padding: 0.15rem 0.3rem;
      border-radius: 4px;
    }

    .clear-all-btn:hover {
      text-decoration: underline;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
      margin-top: 0.5rem;
    }

    .card {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
      color: inherit;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      background: var(--card-hover);
    }

    .card:focus-within {
      border-color: var(--accent);
    }

    .card-category {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 0.6rem;
    }

    .card-link {
      color: inherit;
      text-decoration: none;
    }

    .card-link::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      border-radius: 10px;
    }

    .card-link:focus {
      outline: none;
    }

    .card-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 1.15rem;
      flex: 1;
    }

    .card-match {
      margin-bottom: 1.1rem;
      padding: 0.65rem 0.75rem;
      background: rgba(88, 166, 255, 0.06);
      border: 1px solid rgba(88, 166, 255, 0.22);
      border-radius: 6px;
      font-size: 0.8rem;
      line-height: 1.45;
    }

    .card-match-label {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      margin-bottom: 0.3rem;
    }

    .card-match-excerpt {
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-match-excerpt mark {
      background: rgba(88, 166, 255, 0.24);
      color: var(--text-main);
      padding: 0.04rem 0.2rem;
      border-radius: 3px;
      font-weight: 600;
    }

    .card-sublinks {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.45rem;
    }

    .card-sublink {
      position: relative;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.74rem;
      color: var(--accent);
      background: rgba(88, 166, 255, 0.1);
      border: 1px solid rgba(88, 166, 255, 0.25);

      border-radius: 4px;
      text-decoration: none;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .card-sublink:hover {
      background: rgba(88, 166, 255, 0.2);
      border-color: var(--accent);
    }

    .card-tags {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }

    .tag {
      position: relative;
      z-index: 2;
      font-size: 0.75rem;
      font-family: inherit;
      padding: 0.2rem 0.52rem;
      background: var(--tag-bg);
      color: var(--tag-text);
      border-radius: 4px;
      border: 1px solid rgba(126, 231, 135, 0.2);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tag:hover {
      border-color: rgba(126, 231, 135, 0.6);
      background: rgba(126, 231, 135, 0.14);
    }

    .tag.active {
      background: var(--tag-text);
      color: #0d1117;
      border-color: var(--tag-text);
      font-weight: 600;
    }

    .card-action {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--accent);
    }

    .card-action svg {
      transition: transform 0.15s ease;
    }

    .card:hover .card-action svg {
      transform: translateX(4px);
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-muted);
    }

    .empty-reset-btn {
      margin-top: 0.85rem;
      padding: 0.45rem 0.9rem;
      background: var(--tag-bg);
      border: 1px solid var(--border);
      color: var(--accent);
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .empty-reset-btn:hover {
      border-color: var(--accent);
      background: var(--card-hover);
    }

    footer {
      margin-top: 4rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }
  </style>
</head>

        if (corrected && corrected !== cacheKey) {
          const retryRes = await pf.search(corrected);
          if (retryRes && Array.isArray(retryRes.results)) {
            results = retryRes.results;
          }
        }
      }

      const loaded = await Promise.all(
        results.map(async r => {
          const data = await r.data();
          return { score: r.score || 0, data };
        })
      );

      const hitMap = new Map();
      for (const { score, data } of loaded) {
        const id = extractExperimentIdFromPagefind(data);
        if (!id) continue;
        const prev = hitMap.get(id);
        if (!prev || score > prev.score) {
          hitMap.set(id, {
            score,
            excerpt: data.excerpt || "",
            subResults: Array.isArray(data.sub_results) ? data.sub_results : []
          });
        }
      }

      pagefindQueryCache.set(cacheKey, hitMap);
      return hitMap;
    }

    async function triggerPagefindSearch(rawQuery) {
      const trimmed = rawQuery.trim();
      const seq = ++searchRequestSeq;
      if (!trimmed) {
        activePagefindHits = new Map();
        return;
      }

      const cacheKey = trimmed.toLowerCase();
      if (pagefindQueryCache.has(cacheKey)) {
        activePagefindHits = pagefindQueryCache.get(cacheKey);
        render();
        return;
      }

      const pf = await ensurePagefind();
      if (!pf || seq !== searchRequestSeq) return;

      try {
        const hitMap = await fetchPagefindMap(pf, trimmed);
        if (seq !== searchRequestSeq) return;
        activePagefindHits = hitMap;
        render();
      } catch (err) {
        console.warn("Pagefind search error:", err);
      }
    }

    function itemMatchesTag(item, tagFilter) {
      if (!tagFilter) return true;
      const needle = tagFilter.toLowerCase();
      return (item.tags || []).some(t => t.toLowerCase() === needle);
    }

    function queryAllCategories(rawQuery, tagFilter, pfHitsOverride) {
      const trimmed = rawQuery.trim();
      const pfHits = pfHitsOverride || (trimmed ? (pagefindQueryCache.get(trimmed.toLowerCase()) || activePagefindHits) : new Map());

      if (!trimmed) {
        return searchIndex
          .filter(doc => itemMatchesTag(doc.item, tagFilter))
          .map(doc => ({ item: doc.item, score: 0, idx: doc.idx, pfHit: null }));
      }

      const catalogScores = scoreCatalogMap(trimmed);
      const scored = [];

      for (const doc of searchIndex) {
        if (!itemMatchesTag(doc.item, tagFilter)) continue;
        const catScore = catalogScores.get(doc.item.id) || 0;
        const pfHit = pfHits.get(doc.item.id) || null;
        const pfScore = pfHit ? pfHit.score : 0;
        const combined = catScore * 3.0 + pfScore;
        if (combined <= 0) continue;
        scored.push({
          item: doc.item,
          score: combined,
          idx: doc.idx,
          pfHit
        });
      }

      scored.sort((a, b) => b.score - a.score || a.idx - b.idx);
      return scored;
    }

    function searchExperiments(rawQuery, categoryFilter, tagFilter) {
      return queryAllCategories(rawQuery, tagFilter || "")
        .filter(entry => categoryFilter === "All" || entry.item.category === categoryFilter)
        .map(entry => entry.item);
    }

    function getOrderedCategories() {
      const present = new Set(experiments.map(item => item.category).filter(Boolean));
      const ordered = ["All"];
      for (const cat of PREFERRED_CATEGORY_ORDER) {
        if (cat !== "All" && present.has(cat)) {
          ordered.push(cat);
          present.delete(cat);
        }
      }
      for (const extra of Array.from(present).sort((a, b) => a.localeCompare(b))) {
        ordered.push(extra);
      }
      return ordered;
    }

    function renderCategories(matchedEntries) {
      const container = document.getElementById("categories");
      if (!container) return;

      const counts = new Map();
      counts.set("All", matchedEntries.length);
      for (const entry of matchedEntries) {
        const cat = entry.item.category;
        counts.set(cat, (counts.get(cat) || 0) + 1);
      }

      const categories = getOrderedCategories();
      if (activeCategory !== "All" && !categories.includes(activeCategory)) {
        activeCategory = "All";
      }

      container.innerHTML = categories.map(cat => {
        const count = counts.get(cat) || 0;
        const isActive = cat === activeCategory;
        const isZero = count === 0 && !isActive;
        const cls = ["cat-btn", isActive ? "active" : "", isZero ? "zero" : ""].filter(Boolean).join(" ");
        return `<button type="button" class="${cls}" data-cat="${escapeHtml(cat)}">${escapeHtml(cat)}<span class="cat-count">${count}</span></button>`;
      }).join("");
    }

    function renderFilterStatus(filteredCount) {
      const statusEl = document.getElementById("filterStatus");
      if (!statusEl) return;

      const hasQuery = Boolean(searchQuery.trim());
      const hasTag = Boolean(activeTag);
      const hasCat = activeCategory !== "All";

      if (!hasQuery && !hasTag && !hasCat) {
        statusEl.hidden = true;
        statusEl.innerHTML = "";
        return;
      }

      statusEl.hidden = false;
      const noun = experiments.length === 1 ? "experiment" : "experiments";
      const tagChipHtml = hasTag
        ? `<button type="button" class="active-tag-chip" id="clearActiveTagBtn" aria-label="Remove tag filter ${escapeHtml(activeTag)}">Tag: ${escapeHtml(activeTag)} <span aria-hidden="true">&times;</span></button>`
        : "";

      statusEl.innerHTML = `
        <div class="filter-status-left">
          <span>Showing <strong>${filteredCount}</strong> of ${experiments.length} ${noun}</span>
          ${tagChipHtml}
        </div>
        <button type="button" class="clear-all-btn" id="resetAllFiltersBtn">Reset filters</button>
      `;

      const clearTagBtn = document.getElementById("clearActiveTagBtn");
      if (clearTagBtn) {
        clearTagBtn.addEventListener("click", () => {
          activeTag = "";
          render();
        });
      }

      const resetAllBtn = document.getElementById("resetAllFiltersBtn");
      if (resetAllBtn) {
        resetAllBtn.addEventListener("click", () => {
          searchQuery = "";
          activeTag = "";
          activeCategory = "All";
          activePagefindHits = new Map();
          if (searchInputEl) searchInputEl.value = "";
          render();
        });
      }
    }

    function buildCardMatchHtml(item, pfHit) {
      if (!searchQuery.trim() || !pfHit) return "";

      const itemNormTitle = cleanTerm(item.title);
      const seenHashes = new Set();
      const subLinks = [];

      for (const sr of (pfHit.subResults || [])) {
        if (!sr || !sr.url || !sr.title) continue;
        const hashIdx = sr.url.indexOf("#");
        if (hashIdx === -1) continue;
        const anchor = sr.url.slice(hashIdx + 1);
        if (!anchor || !/^[A-Za-z0-9_.:-]+$/.test(anchor) || seenHashes.has(anchor)) continue;
        const cleanSubTitle = String(sr.title).replace(/\s+/g, " ").trim();
        if (!cleanSubTitle || cleanTerm(cleanSubTitle) === itemNormTitle) continue;
        seenHashes.add(anchor);
        subLinks.push({
          title: cleanSubTitle,
          href: item.path + "#" + anchor
        });
        if (subLinks.length >= 2) break;
      }

      const safeExcerpt = sanitizeExcerpt(pfHit.excerpt);
      if (!safeExcerpt && subLinks.length === 0) return "";

      const subLinksHtml = subLinks.length > 0
        ? `<div class="card-sublinks">${subLinks.map(sl => `<a class="card-sublink" href="${escapeHtml(sl.href)}" title="Jump to section: ${escapeHtml(sl.title)}">&rarr; ${escapeHtml(sl.title)}</a>`).join("")}</div>`
        : "";

      return `
        <div class="card-match">
          <div class="card-match-label">Matched inside experiment</div>
          ${safeExcerpt ? `<p class="card-match-excerpt">&hellip;${safeExcerpt}&hellip;</p>` : ""}
          ${subLinksHtml}
        </div>
      `;
    }

    function updateClearButton() {
      const clearBtn = document.getElementById("searchClear");
      if (clearBtn) {
        clearBtn.classList.toggle("visible", Boolean(searchQuery.trim().length || searchQuery.length));
      }
    }

    function setActiveCategory(cat) {
      activeCategory = cat;
    }

    async function loadExperiments() {
      rebuildSearchIndex();
      render();
      try {
        const res = await fetch("experiments.json");
        if (res.ok) {
          experiments = await res.json();
          rebuildSearchIndex();
        }
      } catch (err) {
        console.warn("Using embedded manifest fallback:", err);
      }
      render();
      if (searchQuery.trim()) {
        triggerPagefindSearch(searchQuery);
      } else {
        setTimeout(() => ensurePagefind(), 60);
      }
    }

    function render() {
      const grid = document.getElementById("experimentGrid");
      updateClearButton();

      const matchedAcrossCategories = queryAllCategories(searchQuery, activeTag);
      renderCategories(matchedAcrossCategories);

      const filtered = matchedAcrossCategories.filter(
        entry => activeCategory === "All" || entry.item.category === activeCategory
      );

      renderFilterStatus(filtered.length);

      if (filtered.length === 0) {
        if (activeCategory !== "All" && matchedAcrossCategories.length > 0) {
          const noun = matchedAcrossCategories.length === 1 ? "experiment" : "experiments";
          const filterDesc = searchQuery.trim()
            ? `matched &ldquo;${escapeHtml(searchQuery.trim())}&rdquo;`
            : `matched tag &ldquo;${escapeHtml(activeTag)}&rdquo;`;
          grid.innerHTML = `
            <div class="empty-state">
              <div>No experiments in <strong>${escapeHtml(activeCategory)}</strong> ${filterDesc}.</div>
              <button type="button" class="empty-reset-btn" id="showAllCategoriesBtn">
                Show ${matchedAcrossCategories.length} matching ${noun} in All categories
              </button>
            </div>
          `;
          const resetBtn = document.getElementById("showAllCategoriesBtn");
          if (resetBtn) {
            resetBtn.addEventListener("click", () => {
              setActiveCategory("All");
              render();
            });
          }
          return;
        }
        if (activeTag) {
          const withoutTag = queryAllCategories(searchQuery, "");
          if (withoutTag.length > 0) {
            grid.innerHTML = `
              <div class="empty-state">
                <div>No experiments with tag <strong>${escapeHtml(activeTag)}</strong> matched your search.</div>
                <button type="button" class="empty-reset-btn" id="clearEmptyTagBtn">
                  Clear tag filter (${escapeHtml(activeTag)})
                </button>
              </div>
            `;
            const clearTagBtn = document.getElementById("clearEmptyTagBtn");
            if (clearTagBtn) {
              clearTagBtn.addEventListener("click", () => {
                activeTag = "";
                render();
              });
            }
            return;
          }
        }
        grid.innerHTML = '<div class="empty-state">No experiments found matching your filter.</div>';
        return;
      }

      grid.innerHTML = filtered.map(({ item, pfHit }) => `
        <article class="card">
          <div>
            <div class="card-category">${escapeHtml(item.category)}</div>
            <h2 class="card-title">
              <a class="card-link" href="${escapeHtml(item.path)}">${escapeHtml(item.title)}</a>
            </h2>
            <p class="card-desc">${escapeHtml(item.description)}</p>
            ${buildCardMatchHtml(item, pfHit)}
          </div>
          <div>
            <div class="card-tags">
              ${(item.tags || []).map(t => {
                const isTagActive = Boolean(activeTag) && activeTag.toLowerCase() === t.toLowerCase();
                return `<button type="button" class="tag${isTagActive ? " active" : ""}" data-tag="${escapeHtml(t)}" aria-pressed="${isTagActive ? "true" : "false"}" title="Filter by tag: ${escapeHtml(t)}">${escapeHtml(t)}</button>`;
              }).join("")}
            </div>
            <div class="card-action" aria-hidden="true">
              Launch Experiment
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </div>
          </div>
        </article>
      `).join("");
    }

    const searchInputEl = document.getElementById("searchInput");
    const searchClearEl = document.getElementById("searchClear");

    // Optional initial URL query parameters (?q=... & ?cat=... & ?tag=...)
    try {
      const params = new URLSearchParams(window.location.search);
      const initialQ = params.get("q");
      const initialCat = params.get("cat");
      const initialTag = params.get("tag");
      if (initialQ) {
        searchQuery = initialQ;
        searchInputEl.value = initialQ;
      }
      if (initialCat) {
        activeCategory = initialCat;
      }
      if (initialTag) {
        activeTag = initialTag;
      }
    } catch (_) {
      // Ignore malformed URL parameters
    }

    searchInputEl.addEventListener("input", e => {
      searchQuery = e.target.value;
      if (!searchQuery.trim()) {
        searchRequestSeq++;
        activePagefindHits = new Map();
        render();
      } else {
        render();
        triggerPagefindSearch(searchQuery);
      }
    });

    searchInputEl.addEventListener("focus", () => {
      ensurePagefind();
    });

    searchInputEl.addEventListener("keydown", e => {
      if (e.key === "Escape") {
        if (searchInputEl.value) {
          e.preventDefault();
          searchInputEl.value = "";
          searchQuery = "";
          searchRequestSeq++;
          activePagefindHits = new Map();
          render();
        } else if (activeTag) {
          e.preventDefault();
          activeTag = "";
          render();
        }
      }
    });

    searchClearEl.addEventListener("click", () => {
      searchInputEl.value = "";
      searchQuery = "";
      searchRequestSeq++;
      activePagefindHits = new Map();
      render();
      searchInputEl.focus();
    });

    document.addEventListener("keydown", e => {
      if (e.key === "/" && !e.ctrlKey && !e.metaKey && !e.altKey) {
        const tag = (document.activeElement && document.activeElement.tagName) || "";
        if (tag !== "INPUT" && tag !== "TEXTAREA" && !(document.activeElement && document.activeElement.isContentEditable)) {
          e.preventDefault();
          searchInputEl.focus();
        }
      }
    });

    document.getElementById("categories").addEventListener("click", e => {
      const btn = e.target.closest(".cat-btn");
      if (btn) {
        setActiveCategory(btn.dataset.cat);
        render();
      }
    });

    document.getElementById("experimentGrid").addEventListener("click", e => {
      const tagBtn = e.target.closest(".tag");
      if (tagBtn && tagBtn.dataset.tag) {
        e.preventDefault();
        e.stopPropagation();
        const clicked = tagBtn.dataset.tag;
        activeTag = (activeTag && activeTag.toLowerCase() === clicked.toLowerCase()) ? "" : clicked;
        render();
      }
    });

    loadExperiments();
  </script>
</body>
</html>
