<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="qc-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f1f2c"/><stop offset="100%" stop-color="#182c3f"/></linearGradient>
    <filter id="qc-glow"><feGaussianBlur stdDeviation="3" result="glow"/><feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="qc-wire" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#d7f26b"/><stop offset="100%" stop-color="#38ef7d"/></linearGradient>
  </defs>
  <rect width="320" height="200" rx="14" fill="url(#qc-bg)"/>
  <!-- Circuit board traces -->
  <path d="M 20 100 H 90 V 60 H 130" stroke="#335872" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 20 120 H 70 V 150 H 130" stroke="#335872" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 190 60 H 230 V 100 H 300" stroke="#335872" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 190 150 H 250 V 120 H 300" stroke="#335872" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Josephson Junction / Island box -->
  <rect x="130" y="45" width="60" height="110" rx="8" fill="#132738" stroke="#5da9e9" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="145" y1="75" x2="175" y2="75" stroke="#d7f26b" stroke-width="3" filter="url(#qc-glow)"/>
  <line x1="145" y1="100" x2="175" y2="100" stroke="#ff765f" stroke-width="3" filter="url(#qc-glow)"/>
  <line x1="145" y1="125" x2="175" y2="125" stroke="#38ef7d" stroke-width="3" filter="url(#qc-glow)"/>
  
  <!-- Quantum wave tunneling -->
  <path d="M 40 100 Q 60 70 80 100 T 120 100 T 160 100 T 200 100 T 240 100 T 280 100" fill="none" stroke="url(#qc-wire)" stroke-width="3.5" filter="url(#qc-glow)"/>
  
  <!-- Energy level tags -->
  <circle cx="160" cy="100" r="14" fill="#ff765f" filter="url(#qc-glow)"/>
  <text x="160" y="104" font-family="sans-serif" font-weight="bold" font-size="10" fill="#182321" text-anchor="middle">Ψ</text>
  <text x="160" y="32" font-family="sans-serif" font-size="11" fill="#99c8f0" font-weight="700" text-anchor="middle">Macroscopic Quantum Circuit</text>
  <text x="160" y="180" font-family="sans-serif" font-size="10" fill="#d7f26b" text-anchor="middle">Tunneling across energy states</text>
</svg>