<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="gold-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#19221e"/><stop offset="100%" stop-color="#24332d"/></linearGradient>
    <filter id="gold-glow"><feGaussianBlur stdDeviation="2.5" result="glow"/><feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="320" height="200" rx="14" fill="url(#gold-bg)"/>
  <!-- Historical 200-Year U-Shaped Curve of Women in the Labor Force -->
  <!-- Axes -->
  <line x1="45" y1="150" x2="285" y2="150" stroke="#52645b" stroke-width="2"/>
  <line x1="45" y1="40" x2="45" y2="150" stroke="#52645b" stroke-width="2"/>
  <!-- U-shaped Curve -->
  <path d="M 55 75 Q 125 150 175 140 Q 235 110 275 60" fill="none" stroke="#d7f26b" stroke-width="4" stroke-linecap="round" filter="url(#gold-glow)"/>
  <!-- Historical inflection milestones -->
  <circle cx="55" cy="75" r="5" fill="#ff765f"/>
  <circle cx="150" cy="144" r="5" fill="#ff765f"/>
  <circle cx="275" cy="60" r="6" fill="#d7f26b" filter="url(#gold-glow)"/>
  <!-- Labels -->
  <text x="55" y="165" font-family="sans-serif" font-size="8" fill="#8ca094" text-anchor="middle">Agrarian (1800s)</text>
  <text x="155" y="165" font-family="sans-serif" font-size="8" fill="#8ca094" text-anchor="middle">Industrialization Dip</text>
  <text x="270" y="165" font-family="sans-serif" font-size="8" fill="#8ca094" text-anchor="middle">Services &amp; Education</text>
  <!-- Milestone callouts -->
  <text x="275" y="48" font-family="sans-serif" font-size="9" font-weight="bold" fill="#d7f26b" text-anchor="middle">Pill &amp; College</text>
  <text x="160" y="24" font-family="sans-serif" font-size="11" fill="#d7f26b" font-weight="700" text-anchor="middle">Two Centuries of Women’s Labour Market Data</text>
</svg>