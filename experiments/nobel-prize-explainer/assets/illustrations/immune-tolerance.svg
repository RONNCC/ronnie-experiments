<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="imm-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2c1424"/><stop offset="100%" stop-color="#3d1b33"/></linearGradient>
    <filter id="imm-glow"><feGaussianBlur stdDeviation="3" result="glow"/><feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="320" height="200" rx="14" fill="url(#imm-bg)"/>
  <!-- Healthy body tissue / cell -->
  <g transform="translate(70, 105)">
    <circle cx="0" cy="0" r="32" fill="#ff765f" opacity="0.85"/>
    <circle cx="0" cy="0" r="16" fill="#ffa896"/>
    <text x="0" y="4" font-family="sans-serif" font-size="8" font-weight="bold" fill="#2c1424" text-anchor="middle">SELF-CELL</text>
  </g>
  <!-- Aggressive Killer T Cell approaching -->
  <g transform="translate(250, 105)">
    <circle cx="0" cy="0" r="26" fill="#e03131"/>
    <!-- Spikes -->
    <path d="M-26 0 L-34 -5 L-26 -10 M-26 0 L-34 5 L-26 10 M-15 -22 L-20 -30 L-8 -25" stroke="#ff8787" stroke-width="2.5" fill="none"/>
    <text x="0" y="4" font-family="sans-serif" font-size="8" font-weight="bold" fill="#fff" text-anchor="middle">EFFECTOR</text>
  </g>
  <!-- Regulatory T Cell (Treg) stepping in between -->
  <g transform="translate(160, 95)" filter="url(#imm-glow)">
    <circle cx="0" cy="0" r="34" fill="#d7f26b"/>
    <!-- Shield / Peace badge -->
    <path d="M -12 -8 Q 0 -18 12 -8 Q 12 12 0 20 Q -12 12 -12 -8 Z" fill="#182321"/>
    <text x="0" y="7" font-family="sans-serif" font-size="11" font-weight="900" fill="#d7f26b" text-anchor="middle">Treg</text>
    <!-- Calming aura lines -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="#d7f26b" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8"/>
  </g>
  <text x="160" y="28" font-family="sans-serif" font-size="11" fill="#fcc2d7" font-weight="700" text-anchor="middle">Peripheral Immune Tolerance</text>
  <text x="160" y="180" font-family="sans-serif" font-size="10" fill="#d7f26b" text-anchor="middle">Regulatory T-Cells (Treg) act as the immune system's brakes</text>
</svg>