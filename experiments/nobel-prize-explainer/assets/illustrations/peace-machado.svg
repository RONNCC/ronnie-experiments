<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="pcm-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1c2833"/><stop offset="100%" stop-color="#273746"/></linearGradient>
    <linearGradient id="sun-glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffd43b"/><stop offset="100%" stop-color="#ff922b"/></linearGradient>
  </defs>
  <rect width="320" height="200" rx="14" fill="url(#pcm-bg)"/>
  <!-- Rising sun of democratic hope -->
  <circle cx="160" cy="140" r="55" fill="url(#sun-glow)" opacity="0.9"/>
  <!-- Sun rays -->
  <g stroke="#ffe066" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <line x1="160" y1="70" x2="160" y2="50"/>
    <line x1="110" y1="90" x2="95" y2="75"/>
    <line x1="210" y1="90" x2="225" y2="75"/>
    <line x1="75" y1="135" x2="55" y2="135"/>
    <line x1="245" y1="135" x2="265" y2="135"/>
  </g>
  <!-- Silhouette of united hands / crowd raising voting ballots -->
  <path d="M 20 200 Q 50 150 90 200 Q 120 140 160 200 Q 200 135 240 200 Q 270 150 300 200 Z" fill="#111c24"/>
  <!-- Raised ballot / parchment icon in center -->
  <g transform="translate(160, 115)">
    <rect x="-14" y="-22" width="28" height="34" rx="4" fill="#ffffff" stroke="#d7f26b" stroke-width="2"/>
    <polyline points="-6,-6 -1,-1 7,-11" fill="none" stroke="#2b8a3e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="-7" y1="4" x2="7" y2="4" stroke="#868e96" stroke-width="2"/>
  </g>
  <text x="160" y="28" font-family="sans-serif" font-size="11" fill="#ffe066" font-weight="700" text-anchor="middle">Civic Movement &amp; Democratic Rights</text>
  <text x="160" y="185" font-family="sans-serif" font-size="10" fill="#d7f26b" text-anchor="middle">Citizen courage, open elections, and peaceful transition</text>
</svg>