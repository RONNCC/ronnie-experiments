<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="nh-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1a252f"/><stop offset="100%" stop-color="#2c3e50"/></linearGradient>
  </defs>
  <rect width="320" height="200" rx="14" fill="url(#nh-bg)"/>
  <!-- Origami Peace Crane (Orizuru) -->
  <g transform="translate(160, 95) scale(0.95)">
    <!-- Wings and body polygons -->
    <polygon points="0,-40 -70,-20 -20,20" fill="#ffffff" opacity="0.95"/>
    <polygon points="0,-40 70,-20 20,20" fill="#e9ecef" opacity="0.95"/>
    <polygon points="0,-40 -20,20 0,40" fill="#ced4da"/>
    <polygon points="0,-40 20,20 0,40" fill="#dee2e6"/>
    <!-- Head and tail -->
    <polyline points="0,-40 -40,-65 -45,-58" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="0" y1="40" x2="35" y2="65" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- Concentric expanding ripples of survivor testimony -->
  <circle cx="160" cy="100" r="60" fill="none" stroke="#d7f26b" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>
  <circle cx="160" cy="100" r="85" fill="none" stroke="#d7f26b" stroke-width="1" stroke-dasharray="4 6" opacity="0.3"/>
  
  <text x="160" y="24" font-family="sans-serif" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">A World Free of Nuclear Weapons</text>
  <text x="160" y="185" font-family="sans-serif" font-size="10" fill="#d7f26b" text-anchor="middle">Grassroots Hibakusha testimony building a global taboo</text>
</svg>