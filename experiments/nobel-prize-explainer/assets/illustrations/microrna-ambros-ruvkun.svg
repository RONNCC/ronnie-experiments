<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="mrna-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#24172e"/><stop offset="100%" stop-color="#3b234d"/></linearGradient>
    <filter id="rna-glow"><feGaussianBlur stdDeviation="2.5" result="glow"/><feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="320" height="200" rx="14" fill="url(#mrna-bg)"/>
  <!-- Messenger RNA (mRNA) strand -->
  <g transform="translate(0, 30)">
    <path d="M 30 70 C 80 50, 120 90, 160 70 C 200 50, 240 90, 290 70" fill="none" stroke="#748ffc" stroke-width="6" stroke-linecap="round"/>
    <!-- Bases on mRNA -->
    <line x1="60" y1="62" x2="60" y2="78" stroke="#ffffff" stroke-width="3"/>
    <line x1="90" y1="60" x2="90" y2="76" stroke="#ffffff" stroke-width="3"/>
    <line x1="120" y1="78" x2="120" y2="94" stroke="#ffffff" stroke-width="3"/>
    <line x1="150" y1="73" x2="150" y2="89" stroke="#ffffff" stroke-width="3"/>
    <line x1="180" y1="58" x2="180" y2="74" stroke="#ffffff" stroke-width="3"/>
    <line x1="210" y1="68" x2="210" y2="84" stroke="#ffffff" stroke-width="3"/>
    <line x1="240" y1="84" x2="240" y2="100" stroke="#ffffff" stroke-width="3"/>
    <line x1="270" y1="72" x2="270" y2="88" stroke="#ffffff" stroke-width="3"/>
  </g>
  <!-- Tiny MicroRNA (miRNA) docking on specific sequence -->
  <g transform="translate(130, 75)" filter="url(#rna-glow)">
    <rect x="0" y="0" width="75" height="18" rx="9" fill="#d7f26b"/>
    <text x="37" y="13" font-family="sans-serif" font-size="9" font-weight="900" fill="#182321" text-anchor="middle">microRNA</text>
    <!-- Binding match pegs -->
    <line x1="15" y1="18" x2="15" y2="28" stroke="#ff765f" stroke-width="3"/>
    <line x1="37" y1="18" x2="37" y2="28" stroke="#ff765f" stroke-width="3"/>
    <line x1="60" y1="18" x2="60" y2="28" stroke="#ff765f" stroke-width="3"/>
  </g>
  <!-- Translation blocked indicator -->
  <circle cx="250" cy="140" r="18" fill="#e03131" opacity="0.9"/>
  <line x1="239" y1="129" x2="261" y2="151" stroke="#ffffff" stroke-width="3"/>
  <line x1="261" y1="129" x2="239" y2="151" stroke="#ffffff" stroke-width="3"/>
  <text x="215" y="144" font-family="sans-serif" font-size="10" fill="#ffc9c9" font-weight="bold" text-anchor="end">TRANSLATION TUNED</text>
  
  <text x="160" y="24" font-family="sans-serif" font-size="11" fill="#e599f7" font-weight="700" text-anchor="middle">Post-Transcriptional Gene Regulation</text>
  <text x="160" y="185" font-family="sans-serif" font-size="10" fill="#d7f26b" text-anchor="middle">Tiny RNA fragments precisely dial protein levels up or down</text>
</svg>