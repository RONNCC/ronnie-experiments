<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="gro-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#162621"/><stop offset="100%" stop-color="#1f3b30"/></linearGradient>
  </defs>
  <rect width="320" height="200" rx="14" fill="url(#gro-bg)"/>
  <!-- Creative destruction cycles: upward stepped waves -->
  <path d="M 30 150 C 60 150, 75 140, 95 115" fill="none" stroke="#ff765f" stroke-width="3" stroke-dasharray="4 3"/>
  <path d="M 90 125 C 130 120, 150 95, 185 75" fill="none" stroke="#ffd43b" stroke-width="3"/>
  <path d="M 180 85 C 220 80, 240 50, 290 35" fill="none" stroke="#d7f26b" stroke-width="4"/>
  <!-- Arrows showing jumps -->
  <polygon points="290,30 295,42 284,40" fill="#d7f26b"/>
  <!-- Gear wheels (innovation engines) -->
  <g transform="translate(85, 120) scale(0.7)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#ff765f" stroke-width="4"/>
    <line x1="-24" y1="0" x2="24" y2="0" stroke="#ff765f" stroke-width="4"/>
    <line x1="0" y1="-24" x2="0" y2="24" stroke="#ff765f" stroke-width="4"/>
  </g>
  <g transform="translate(180, 75) scale(0.9)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#d7f26b" stroke-width="4"/>
    <line x1="-24" y1="0" x2="24" y2="0" stroke="#d7f26b" stroke-width="4"/>
    <line x1="0" y1="-24" x2="0" y2="24" stroke="#d7f26b" stroke-width="4"/>
  </g>
  <!-- Lightbulb spark of knowledge -->
  <g transform="translate(265, 45)">
    <circle cx="0" cy="0" r="12" fill="#ffd43b"/>
    <text x="0" y="4" font-family="sans-serif" font-size="11" font-weight="900" fill="#182321" text-anchor="middle">💡</text>
  </g>
  <text x="160" y="24" font-family="sans-serif" font-size="11" fill="#d7f26b" font-weight="700" text-anchor="middle">Creative Destruction &amp; Knowledge Growth</text>
  <text x="160" y="182" font-family="sans-serif" font-size="10" fill="#a3cfbb" text-anchor="middle">New technologies leapfrog old paradigms in an endless spiral</text>
</svg>