<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="qd-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#111827"/><stop offset="100%" stop-color="#1f2937"/></linearGradient>
    <filter id="qd-glow"><feGaussianBlur stdDeviation="4" result="glow"/><feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="320" height="200" rx="14" fill="url(#qd-bg)"/>
  <!-- 3 Quantum Dots varying by size and emitted wavelength (Quantum Confinement) -->
  <!-- Small dot: Blue (high energy) -->
  <g transform="translate(60, 105)">
    <circle cx="0" cy="0" r="14" fill="#3b82f6" filter="url(#qd-glow)"/>
    <circle cx="0" cy="0" r="14" fill="#60a5fa"/>
    <text x="0" y="32" font-family="sans-serif" font-size="10" font-weight="bold" fill="#60a5fa" text-anchor="middle">2 nm · Blue</text>
    <text x="0" y="46" font-family="sans-serif" font-size="8" fill="#9ca3af" text-anchor="middle">High Energy</text>
  </g>
  <!-- Medium dot: Green -->
  <g transform="translate(160, 105)">
    <circle cx="0" cy="0" r="22" fill="#10b981" filter="url(#qd-glow)"/>
    <circle cx="0" cy="0" r="22" fill="#34d399"/>
    <text x="0" y="36" font-family="sans-serif" font-size="10" font-weight="bold" fill="#34d399" text-anchor="middle">4 nm · Green</text>
    <text x="0" y="50" font-family="sans-serif" font-size="8" fill="#9ca3af" text-anchor="middle">Medium Energy</text>
  </g>
  <!-- Large dot: Red (lower energy) -->
  <g transform="translate(260, 105)">
    <circle cx="0" cy="0" r="32" fill="#ef4444" filter="url(#qd-glow)"/>
    <circle cx="0" cy="0" r="32" fill="#f87171"/>
    <text x="0" y="44" font-family="sans-serif" font-size="10" font-weight="bold" fill="#f87171" text-anchor="middle">6 nm · Red</text>
    <text x="0" y="58" font-family="sans-serif" font-size="8" fill="#9ca3af" text-anchor="middle">Lower Energy</text>
  </g>
  
  <text x="160" y="24" font-family="sans-serif" font-size="11" fill="#f3f4f6" font-weight="700" text-anchor="middle">Quantum Confinement: Size Governs Color</text>
</svg>