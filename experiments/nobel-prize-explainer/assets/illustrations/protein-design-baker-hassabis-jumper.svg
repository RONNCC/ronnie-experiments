<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="prot-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#132328"/><stop offset="100%" stop-color="#1d3840"/></linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ff765f"/><stop offset="50%" stop-color="#d7f26b"/><stop offset="100%" stop-color="#4dabf7"/></linearGradient>
    <filter id="prot-glow"><feGaussianBlur stdDeviation="3" result="glow"/><feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="320" height="200" rx="14" fill="url(#prot-bg)"/>
  <!-- Alpha-helix spiral ribbon -->
  <path d="M 40 130 C 50 60, 90 60, 100 130 C 110 200, 150 200, 160 130 C 170 60, 210 60, 220 130 C 230 200, 270 200, 280 130" fill="none" stroke="url(#ribbon)" stroke-width="12" stroke-linecap="round" filter="url(#prot-glow)"/>
  <!-- Beta sheet arrow guides -->
  <path d="M 70 80 Q 160 50 250 80" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.7"/>
  <!-- AI target docking site -->
  <g transform="translate(160, 75)" filter="url(#prot-glow)">
    <circle cx="0" cy="0" r="16" fill="#d7f26b"/>
    <text x="0" y="5" font-family="sans-serif" font-size="10" font-weight="900" fill="#182321" text-anchor="middle">AI</text>
  </g>
  <text x="160" y="26" font-family="sans-serif" font-size="11" fill="#a5d8ff" font-weight="700" text-anchor="middle">AlphaFold &amp; Computational Protein Design</text>
  <text x="160" y="182" font-family="sans-serif" font-size="10" fill="#d7f26b" text-anchor="middle">From amino acid sequence to 3D nanomachinery</text>
</svg>