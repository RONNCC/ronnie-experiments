<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="hk-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1f1d24"/><stop offset="100%" stop-color="#2d2228"/></linearGradient>
  </defs>
  <rect width="320" height="200" rx="14" fill="url(#hk-bg)"/>
  <!-- Tree of memory and human tenderness / delicate poetic white flower -->
  <g transform="translate(160, 110)">
    <!-- Branching fragile veins / tree -->
    <path d="M 0 60 Q -10 20 0 -20 Q 20 -50 0 -80" fill="none" stroke="#ced4da" stroke-width="3" stroke-linecap="round"/>
    <path d="M 0 -20 Q -40 -35 -55 -60" fill="none" stroke="#adb5bd" stroke-width="2" stroke-linecap="round"/>
    <path d="M 0 -20 Q 40 -30 65 -50" fill="none" stroke="#adb5bd" stroke-width="2" stroke-linecap="round"/>
    <path d="M 0 10 Q -30 0 -50 15" fill="none" stroke="#adb5bd" stroke-width="2" stroke-linecap="round"/>
    
    <!-- White blossoming petals (The Vegetarian / Human Acts) -->
    <circle cx="-55" cy="-60" r="10" fill="#ffffff" opacity="0.9"/>
    <circle cx="65" cy="-50" r="9" fill="#ffffff" opacity="0.9"/>
    <circle cx="0" cy="-80" r="12" fill="#ffd8a8" opacity="0.9"/>
    <circle cx="-50" cy="15" r="8" fill="#ffffff" opacity="0.85"/>
    
    <!-- Heart core ember -->
    <circle cx="0" cy="5" r="7" fill="#ff765f"/>
  </g>
  <text x="160" y="26" font-family="Georgia, serif" font-size="12" fill="#f8f9fa" font-style="italic" text-anchor="middle">Intense Poetic Prose &amp; Historical Traumas</text>
  <text x="160" y="185" font-family="sans-serif" font-size="10" fill="#d7f26b" text-anchor="middle">Exposing the fragility of human life and the power of memory</text>
</svg>