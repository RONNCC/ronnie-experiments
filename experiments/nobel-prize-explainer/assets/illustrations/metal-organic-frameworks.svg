<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="mof-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#14261c"/><stop offset="100%" stop-color="#233d2e"/></linearGradient>
    <filter id="mof-glow"><feGaussianBlur stdDeviation="2.5" result="glow"/><feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="320" height="200" rx="14" fill="url(#mof-bg)"/>
  <!-- MOF Lattice Cage (Isometric 3D Cube) -->
  <g transform="translate(160, 100)" stroke-linecap="round">
    <!-- Back struts -->
    <line x1="-50" y1="-30" x2="0" y2="-60" stroke="#3e6b52" stroke-width="4"/>
    <line x1="0" y1="-60" x2="50" y2="-30" stroke="#3e6b52" stroke-width="4"/>
    <line x1="0" y1="-60" x2="0" y2="0" stroke="#3e6b52" stroke-width="4"/>
    
    <!-- Central trapped molecule (CO2 / Gas) -->
    <circle cx="0" cy="0" r="15" fill="#ff765f" filter="url(#mof-glow)"/>
    <text x="0" y="4" font-family="sans-serif" font-size="9" font-weight="900" fill="#fff" text-anchor="middle">CO₂</text>
    
    <!-- Floating tiny guest molecules inside cage -->
    <circle cx="-25" cy="-5" r="7" fill="#69db7c" opacity="0.8"/>
    <circle cx="28" cy="10" r="8" fill="#4dabf7" opacity="0.8"/>
    
    <!-- Front struts -->
    <line x1="-50" y1="-30" x2="-50" y2="30" stroke="#74c69d" stroke-width="4"/>
    <line x1="50" y1="-30" x2="50" y2="30" stroke="#74c69d" stroke-width="4"/>
    <line x1="-50" y1="30" x2="0" y2="60" stroke="#74c69d" stroke-width="4"/>
    <line x1="50" y1="30" x2="0" y2="60" stroke="#74c69d" stroke-width="4"/>
    <line x1="0" y1="0" x2="-50" y2="-30" stroke="#52b788" stroke-width="4"/>
    <line x1="0" y1="0" x2="50" y2="-30" stroke="#52b788" stroke-width="4"/>
    <line x1="0" y1="0" x2="0" y2="60" stroke="#74c69d" stroke-width="4"/>
    
    <!-- Metal Nodes (Joints) -->
    <circle cx="-50" cy="-30" r="8" fill="#d7f26b" filter="url(#mof-glow)"/>
    <circle cx="50" cy="-30" r="8" fill="#d7f26b" filter="url(#mof-glow)"/>
    <circle cx="0" cy="-60" r="8" fill="#d7f26b" filter="url(#mof-glow)"/>
    <circle cx="-50" cy="30" r="8" fill="#d7f26b" filter="url(#mof-glow)"/>
    <circle cx="50" cy="30" r="8" fill="#d7f26b" filter="url(#mof-glow)"/>
    <circle cx="0" cy="60" r="8" fill="#d7f26b" filter="url(#mof-glow)"/>
  </g>
  <text x="160" y="28" font-family="sans-serif" font-size="11" fill="#b7e4c7" font-weight="700" text-anchor="middle">Nanoporous Sponge Architecture</text>
  <text x="160" y="185" font-family="sans-serif" font-size="10" fill="#d7f26b" text-anchor="middle">Metal clusters + Organic struts = Molecular Trap</text>
</svg>