<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="atto-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0b132b"/><stop offset="100%" stop-color="#1c2541"/></linearGradient>
    <filter id="atto-glow"><feGaussianBlur stdDeviation="3" result="glow"/><feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="320" height="200" rx="14" fill="url(#atto-bg)"/>
  <!-- Atom core with orbiting electron -->
  <g transform="translate(160, 105)">
    <!-- Orbits -->
    <ellipse cx="0" cy="0" rx="90" ry="32" fill="none" stroke="#3a506b" stroke-width="1.5" transform="rotate(-25)"/>
    <ellipse cx="0" cy="0" rx="90" ry="32" fill="none" stroke="#3a506b" stroke-width="1.5" transform="rotate(35)"/>
    <!-- Nucleus -->
    <circle cx="0" cy="0" r="14" fill="#ff765f" filter="url(#atto-glow)"/>
    <!-- Fast moving electron captured mid-flight -->
    <g transform="rotate(35)">
      <circle cx="65" cy="-22" r="7" fill="#6fffe9" filter="url(#atto-glow)"/>
      <line x1="50" y1="-26" x2="65" y2="-22" stroke="#6fffe9" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
  <!-- Ultra-fast attosecond laser pulse strobe beam -->
  <polygon points="160,10 145,100 175,100" fill="#d7f26b" opacity="0.45" filter="url(#atto-glow)"/>
  <line x1="160" y1="0" x2="160" y2="105" stroke="#ffffff" stroke-width="3" filter="url(#atto-glow)"/>
  
  <text x="160" y="24" font-family="sans-serif" font-size="11" fill="#6fffe9" font-weight="700" text-anchor="middle">Attosecond Physics: 10⁻¹⁸ Second Shutter</text>
  <text x="160" y="185" font-family="sans-serif" font-size="10" fill="#d7f26b" text-anchor="middle">Flashes of light fast enough to track electron motion in real time</text>
</svg>