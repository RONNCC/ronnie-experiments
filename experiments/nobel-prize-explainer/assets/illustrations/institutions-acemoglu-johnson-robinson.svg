<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="inst-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1e242b"/><stop offset="100%" stop-color="#2a333d"/></linearGradient>
  </defs>
  <rect width="320" height="200" rx="14" fill="url(#inst-bg)"/>
  <!-- Two paths: Extractive (top pyramid bottleneck) vs Inclusive (broad pillars of law) -->
  <!-- Left: Extractive narrow funnel -->
  <g transform="translate(85, 105)">
    <polygon points="0,-45 -35,35 35,35" fill="#343a40" stroke="#ff765f" stroke-width="2"/>
    <circle cx="0" cy="-25" r="7" fill="#ff765f"/>
    <text x="0" y="52" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ff765f" text-anchor="middle">EXTRACTIVE</text>
    <text x="0" y="65" font-family="sans-serif" font-size="8" fill="#adb5bd" text-anchor="middle">Power Concentrated</text>
  </g>
  <!-- Divider -->
  <line x1="160" y1="45" x2="160" y2="160" stroke="#495057" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- Right: Inclusive open columns -->
  <g transform="translate(235, 105)">
    <!-- Classical courthouse / institution columns supporting roof -->
    <polygon points="0,-45 -40,-35 40,-35" fill="#d7f26b"/>
    <line x1="-30" y1="-35" x2="-30" y2="35" stroke="#d7f26b" stroke-width="4"/>
    <line x1="-10" y1="-35" x2="-10" y2="35" stroke="#d7f26b" stroke-width="4"/>
    <line x1="10" y1="-35" x2="10" y2="35" stroke="#d7f26b" stroke-width="4"/>
    <line x1="30" y1="-35" x2="30" y2="35" stroke="#d7f26b" stroke-width="4"/>
    <rect x="-42" y="35" width="84" height="8" rx="2" fill="#d7f26b"/>
    <text x="0" y="55" font-family="sans-serif" font-size="10" font-weight="bold" fill="#d7f26b" text-anchor="middle">INCLUSIVE</text>
    <text x="0" y="68" font-family="sans-serif" font-size="8" fill="#adb5bd" text-anchor="middle">Rule of Law &amp; Opportunity</text>
  </g>
  <text x="160" y="24" font-family="sans-serif" font-size="11" fill="#f1f3f5" font-weight="700" text-anchor="middle">How Institutions Shape Long-Term Prosperity</text>
</svg>