<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="fosse-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#141c22"/><stop offset="100%" stop-color="#212d38"/></linearGradient>
  </defs>
  <rect width="320" height="200" rx="14" fill="url(#fosse-bg)"/>
  <!-- Nordic fjord minimalist landscape and theatrical spotlight -->
  <!-- Distant mountains -->
  <polygon points="10,140 70,80 140,140" fill="#1b2832"/>
  <polygon points="110,140 180,65 260,140" fill="#243442"/>
  <polygon points="210,140 270,95 315,140" fill="#1b2832"/>
  <!-- Water reflections -->
  <rect x="0" y="140" width="320" height="60" fill="#0f171d"/>
  <line x1="40" y1="155" x2="120" y2="155" stroke="#374d5d" stroke-width="1"/>
  <line x1="160" y1="165" x2="260" y2="165" stroke="#374d5d" stroke-width="1"/>
  
  <!-- Single lone figure in soft theatre spotlight -->
  <polygon points="160,20 120,150 200,150" fill="#d7f26b" opacity="0.12"/>
  <circle cx="160" cy="115" r="7" fill="#ffffff"/>
  <path d="M 160 122 L 160 148 M 153 133 L 167 133" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Pause ellipsis symbol -->
  <text x="160" y="70" font-family="Georgia, serif" font-size="28" fill="#d7f26b" text-anchor="middle" letter-spacing="8">. . .</text>
  
  <text x="160" y="24" font-family="Georgia, serif" font-size="12" fill="#e2e8f0" font-style="italic" text-anchor="middle">Voice to the Unsayable</text>
  <text x="160" y="185" font-family="sans-serif" font-size="10" fill="#d7f26b" text-anchor="middle">Spare dialogues, rhythm, pauses, and deep emotional resonance</text>
</svg>