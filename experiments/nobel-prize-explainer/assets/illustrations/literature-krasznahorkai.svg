<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="lit-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#191919"/><stop offset="100%" stop-color="#2a2521"/></linearGradient>
  </defs>
  <rect width="320" height="200" rx="14" fill="url(#lit-bg)"/>
  <!-- Swirling prose lines / rhythmic typography -->
  <path d="M 30 140 C 70 80, 120 170, 160 110 C 200 50, 250 140, 290 80" fill="none" stroke="#e6ccb2" stroke-width="2" stroke-dasharray="8 4" opacity="0.6"/>
  <path d="M 40 160 C 80 110, 140 190, 180 130 C 220 70, 260 150, 300 100" fill="none" stroke="#ddb892" stroke-width="1.5" opacity="0.4"/>
  <!-- Open parchment book -->
  <g transform="translate(160, 95)">
    <path d="M -70 40 C -40 25, -20 25, 0 35 C 20 25, 40 25, 70 40 L 65 -35 C 35 -48, 15 -48, 0 -38 C -15 -48, -35 -48, -65 -35 Z" fill="#ede0d4" stroke="#7f5539" stroke-width="2"/>
    <!-- Center spine -->
    <line x1="0" y1="-38" x2="0" y2="35" stroke="#9c6644" stroke-width="2"/>
    <!-- Prose stream on pages -->
    <line x1="-55" y1="-20" x2="-10" y2="-22" stroke="#7f5539" stroke-width="2"/>
    <line x1="-55" y1="-8" x2="-12" y2="-10" stroke="#7f5539" stroke-width="2"/>
    <line x1="-55" y1="4" x2="-10" y2="2" stroke="#7f5539" stroke-width="2"/>
    <line x1="-55" y1="16" x2="-15" y2="14" stroke="#7f5539" stroke-width="2"/>
    <line x1="12" y1="-22" x2="55" y2="-20" stroke="#7f5539" stroke-width="2"/>
    <line x1="10" y1="-10" x2="55" y2="-8" stroke="#7f5539" stroke-width="2"/>
    <line x1="12" y1="2" x2="55" y2="4" stroke="#7f5539" stroke-width="2"/>
    <line x1="15" y1="14" x2="55" y2="16" stroke="#7f5539" stroke-width="2"/>
  </g>
  <!-- Feather quill -->
  <g transform="translate(225, 55) rotate(25)">
    <path d="M 0 0 C 15 -25, 25 -45, 20 -60 C 10 -40, -5 -25, 0 0 Z" fill="#d7f26b"/>
    <line x1="0" y1="0" x2="18" y2="-62" stroke="#182321" stroke-width="1.5"/>
  </g>
  <text x="160" y="28" font-family="Georgia, serif" font-size="12" fill="#ede0d4" font-style="italic" text-anchor="middle">Visionary Prose &amp; The Power of Art</text>
  <text x="160" y="180" font-family="sans-serif" font-size="10" fill="#d7f26b" text-anchor="middle">Wandering sentences exploring memory, beauty, and urgency</text>
</svg>