<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="ml-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#141a29"/><stop offset="100%" stop-color="#1e293b"/></linearGradient>
    <filter id="ml-glow"><feGaussianBlur stdDeviation="2.5" result="glow"/><feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="320" height="200" rx="14" fill="url(#ml-bg)"/>
  <!-- Neural Network layers and synapses -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.4">
    <!-- Input to Hidden -->
    <line x1="50" y1="60" x2="130" y2="50"/><line x1="50" y1="60" x2="130" y2="100"/><line x1="50" y1="60" x2="130" y2="150"/>
    <line x1="50" y1="100" x2="130" y2="50"/><line x1="50" y1="100" x2="130" y2="100"/><line x1="50" y1="100" x2="130" y2="150"/>
    <line x1="50" y1="140" x2="130" y2="50"/><line x1="50" y1="140" x2="130" y2="100"/><line x1="50" y1="140" x2="130" y2="150"/>
    <!-- Hidden to Hidden2 -->
    <line x1="130" y1="50" x2="200" y2="60"/><line x1="130" y1="50" x2="200" y2="100"/><line x1="130" y1="50" x2="200" y2="140"/>
    <line x1="130" y1="100" x2="200" y2="60"/><line x1="130" y1="100" x2="200" y2="100"/><line x1="130" y1="100" x2="200" y2="140"/>
    <line x1="130" y1="150" x2="200" y2="60"/><line x1="130" y1="150" x2="200" y2="100"/><line x1="130" y1="150" x2="200" y2="140"/>
    <!-- Hidden2 to Output -->
    <line x1="200" y1="60" x2="270" y2="80"/><line x1="200" y1="60" x2="270" y2="120"/>
    <line x1="200" y1="100" x2="270" y2="80"/><line x1="200" y1="100" x2="270" y2="120"/>
    <line x1="200" y1="140" x2="270" y2="80"/><line x1="200" y1="140" x2="270" y2="120"/>
  </g>
  <!-- Highlighted active pathway (Hebbian / Hopfield learning) -->
  <path d="M 50 60 L 130 100 L 200 140 L 270 120" stroke="#d7f26b" stroke-width="3.5" fill="none" filter="url(#ml-glow)"/>
  
  <!-- Nodes Layer 1 -->
  <circle cx="50" cy="60" r="10" fill="#38bdf8" filter="url(#ml-glow)"/>
  <circle cx="50" cy="100" r="10" fill="#0284c7"/>
  <circle cx="50" cy="140" r="10" fill="#0284c7"/>
  <!-- Nodes Layer 2 -->
  <circle cx="130" cy="50" r="11" fill="#0284c7"/>
  <circle cx="130" cy="100" r="12" fill="#d7f26b" filter="url(#ml-glow)"/>
  <circle cx="130" cy="150" r="11" fill="#0284c7"/>
  <!-- Nodes Layer 3 -->
  <circle cx="200" cy="60" r="11" fill="#0284c7"/>
  <circle cx="200" cy="100" r="11" fill="#0284c7"/>
  <circle cx="200" cy="140" r="12" fill="#d7f26b" filter="url(#ml-glow)"/>
  <!-- Output nodes -->
  <circle cx="270" cy="80" r="13" fill="#ff765f"/>
  <circle cx="270" cy="120" r="13" fill="#d7f26b" filter="url(#ml-glow)"/>
  <text x="270" y="124" font-family="sans-serif" font-size="9" font-weight="900" fill="#182321" text-anchor="middle">✓</text>
  
  <text x="160" y="24" font-family="sans-serif" font-size="11" fill="#bae6fd" font-weight="700" text-anchor="middle">Artificial Neural Networks &amp; Hopfield Models</text>
  <text x="160" y="185" font-family="sans-serif" font-size="10" fill="#d7f26b" text-anchor="middle">Statistical physics principles powering modern AI</text>
</svg>